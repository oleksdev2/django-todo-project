{% extends 'todo_list/base.html' %}

{% block title %}
	Создание элемента ToDo
{% endblock %}

{% block body %}
  <h3>Создание нового ToDo:</h3>
  <form method="post">{% csrf_token %}
      {{ form.as_p }} 
      {# form.as_p - параграфом, form.as_div - в виде дивов, form.as_ul - в виде списка li #}
      <input type="submit" value="Добавить">
  </form>
{% endblock %}
